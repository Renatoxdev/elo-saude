name: elo-saude

x-app: &app
  build: .
  image: elo-saude-api:local
  env_file: .env
  environment:
    DJANGO_SETTINGS_MODULE: config.settings.local
    DJANGO_DEBUG: 'false'
    DJANGO_SECRET_KEY: ${DJANGO_SECRET_KEY:?Preencha DJANGO_SECRET_KEY no .env}
    DJANGO_JWT_SIGNING_KEY: ${DJANGO_JWT_SIGNING_KEY:?Preencha DJANGO_JWT_SIGNING_KEY no .env}
    DJANGO_ALLOWED_HOSTS: localhost,127.0.0.1
    POSTGRES_DB: ${POSTGRES_DB:?Preencha POSTGRES_DB no .env}
    POSTGRES_USER: ${POSTGRES_USER:?Preencha POSTGRES_USER no .env}
    POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    POSTGRES_HOST: db
    POSTGRES_PORT: '5432'
    POSTGRES_SSLMODE: disable
  read_only: true
  tmpfs:
    - /tmp
  cap_drop:
    - ALL
  security_opt:
    - no-new-privileges:true

services:
  db:
    image: postgres:17-bookworm
    environment:
      POSTGRES_DB: ${POSTGRES_DB:?Preencha POSTGRES_DB no .env}
      POSTGRES_USER: ${POSTGRES_USER:?Preencha POSTGRES_USER no .env}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Preencha POSTGRES_PASSWORD no .env}
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -h 127.0.0.1 -U "$${POSTGRES_USER}" -d "$${POSTGRES_DB}"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s
  migrate:
    <<: *app
    command: ['sh', '-c', 'python manage.py wait_for_db && python manage.py migrate --noinput']
    depends_on:
      db:
        condition: service_healthy
    healthcheck:
      disable: true
    restart: 'no'
  api:
    <<: *app
    ports:
      - '127.0.0.1:8000:8000'
    depends_on:
      db:
        condition: service_healthy
      migrate:
        condition: service_completed_successfully

volumes:
  postgres_data:
