[project]
name = "elo-saude-api"
version = "0.1.0"
description = "API de gerenciamento de consultas e profissionais da saúde."
requires-python = ">=3.12,<3.15"
dependencies = [
    "Django>=5.2.8,<5.3",
    "djangorestframework>=3.16,<3.17",
    "psycopg[binary]>=3.2,<4",
    "django-environ>=0.12,<0.13",
    "django-cors-headers>=4.7,<5",
    "djangorestframework-simplejwt (>=5.5,<6)",
    "django-filter (>=25.1,<26)",
    "httpx (>=0.28,<0.29)",
    "phonenumbers (>=9,<10)",
    "drf-spectacular[sidecar] (>=0.28,<0.30)",
    "gunicorn (>=23,<26)",
    "whitenoise (>=6.9,<7)",
]

[tool.poetry]
package-mode = false
requires-poetry = ">=2.2,<3"

[tool.poetry.group.dev.dependencies]
ruff = ">=0.12,<1"
coverage = ">=7.10,<8"
openapi-schema-validator = ">=0.6,<0.7"

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
"config/settings/local.py" = ["E402", "F403"]
"config/settings/deployment.py" = ["F403", "F405"]
"config/settings/staging.py" = ["F403"]
"config/settings/production.py" = ["F403"]

[tool.coverage.run]
branch = true
patch = ["subprocess"]
source = ["config", "core", "professionals", "appointments", "addresses"]
omit = ["*/tests/*", "*/migrations/*", "config/asgi.py", "config/wsgi.py"]

[tool.coverage.report]
show_missing = true
precision = 2
