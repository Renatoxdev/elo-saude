name: Deploy ECS

on:
  workflow_call:
    inputs:
      environment:
        required: true
        type: string
      image:
        description: URI por digest já publicada e validada em staging; vazio publica o build
        type: string
        default: ''
    outputs:
      image:
        value: ${{ jobs.deploy.outputs.image }}

permissions:
  contents: read

defaults:
  run:
    shell: bash

jobs:
  deploy:
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    environment: ${{ inputs.environment }}
    concurrency:
      group: deploy-${{ inputs.environment }}
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    outputs:
      image: ${{ steps.image.outputs.uri }}
    env:
      AWS_REGION: ${{ vars.AWS_REGION }}
      AWS_ROLE_ARN: ${{ vars.AWS_ROLE_ARN }}
      ECR_REPOSITORY: ${{ vars.ECR_REPOSITORY }}
      ECS_CLUSTER: ${{ vars.ECS_CLUSTER }}
      ECS_SERVICE: ${{ vars.ECS_SERVICE }}
      ECS_TASK_DEFINITION: ${{ vars.ECS_TASK_DEFINITION }}
      ECS_SUBNETS: ${{ vars.ECS_SUBNETS }}
      ECS_SECURITY_GROUPS: ${{ vars.ECS_SECURITY_GROUPS }}
      DEPLOY_ENVIRONMENT: ${{ inputs.environment }}
      PROMOTED_IMAGE: ${{ inputs.image }}
    steps:
      - name: Validar configuração
        shell: bash
        run: |
          if [[ "$GITHUB_REF" != 'refs/heads/main' ]]; then
            echo '::error::Deploy permitido somente em main.'
            exit 1
          fi
          case "$DEPLOY_ENVIRONMENT" in
            staging)
              if [[ -n "$PROMOTED_IMAGE" ]]; then
                echo '::error::Staging deve usar o artifact do build desta execução.'
                exit 1
              fi
              ;;
            production)
              if [[ ! "$PROMOTED_IMAGE" =~ ^[0-9]{12}\.dkr\.ecr\.[a-z0-9-]+\.amazonaws\.com(\.cn)?/[a-z0-9][a-z0-9._/-]*@sha256:[a-f0-9]{64}$ ]]; then
                echo '::error::Produção exige a URI ECR por digest validada em staging.'
                exit 1
              fi
              ;;
            *)
              echo '::error::Ambiente de deploy inválido.'
              exit 1
              ;;
          esac
          for name in AWS_REGION AWS_ROLE_ARN ECR_REPOSITORY ECS_CLUSTER ECS_SERVICE ECS_TASK_DEFINITION ECS_SUBNETS ECS_SECURITY_GROUPS; do
            if [[ -z "${!name}" ]]; then
              echo "::error::Variável ausente no GitHub Environment: $name"
              exit 1
            fi
          done
      - uses: aws-actions/configure-aws-credentials@61815dcd50bd041e203e49132bacad1fd04d2708 # v5
        with:
          role-to-assume: ${{ vars.AWS_ROLE_ARN }}
          aws-region: ${{ vars.AWS_REGION }}
          role-session-name: github-${{ github.run_id }}
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        if: inputs.image == ''
        with:
          name: container-image
      - uses: aws-actions/amazon-ecr-login@03f1aad4c6c7ffd436567f42f9384779290529bd # v2
        if: inputs.image == ''
        id: ecr
      - name: Publicar ou promover a imagem por digest
        id: image
        env:
          REGISTRY: ${{ steps.ecr.outputs.registry }}
        run: |
          if [[ -n "$PROMOTED_IMAGE" ]]; then
            [[ "$PROMOTED_IMAGE" =~ @sha256:[a-f0-9]{64}$ ]]
            echo "uri=$PROMOTED_IMAGE" >> "$GITHUB_OUTPUT"
          else
            gunzip -c image.tar.gz | docker load
            tag="${GITHUB_SHA}-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
            docker tag elo-saude-api:ci "$REGISTRY/$ECR_REPOSITORY:$tag"
            docker push "$REGISTRY/$ECR_REPOSITORY:$tag"
            digest=$(aws ecr describe-images --repository-name "$ECR_REPOSITORY" --image-ids "imageTag=$tag" --query 'imageDetails[0].imageDigest' --output text)
            [[ "$digest" =~ ^sha256:[a-f0-9]{64}$ ]]
            echo "uri=$REGISTRY/$ECR_REPOSITORY@$digest" >> "$GITHUB_OUTPUT"
          fi
      - uses: aws-actions/amazon-ecs-render-task-definition@138c24f321fdbdf7edee4a685519d253cae2cdea # v1
        id: task
        with:
          task-definition-arn: ${{ vars.ECS_TASK_DEFINITION }}
          container-name: api
          image: ${{ steps.image.outputs.uri }}
      - name: Executar migrations e atualizar serviço
        id: deploy
        uses: aws-actions/amazon-ecs-deploy-task-definition@c465972ecbd160473f22e683363b422a5412a3de # v2
        with:
          task-definition: ${{ steps.task.outputs.task-definition }}
          cluster: ${{ vars.ECS_CLUSTER }}
          service: ${{ vars.ECS_SERVICE }}
          run-task: true
          run-task-launch-type: FARGATE
          run-task-subnets: ${{ vars.ECS_SUBNETS }}
          run-task-security-groups: ${{ vars.ECS_SECURITY_GROUPS }}
          run-task-assign-public-IP: DISABLED
          run-task-container-overrides: '[{"name":"api","command":["python","manage.py","migrate","--noinput"]}]'
          wait-for-task-stopped: true
          wait-for-service-stability: true
          wait-for-minutes: 15
      - name: Confirmar que a revisão esperada está ativa
        env:
          EXPECTED_TASK: ${{ steps.deploy.outputs.task-definition-arn }}
        run: |
          aws ecs describe-services --cluster "$ECS_CLUSTER" --services "$ECS_SERVICE" > service.json
          jq --exit-status --arg task "$EXPECTED_TASK" '
            (.failures | length) == 0 and
            (.services | length) == 1 and
            (.services[0] | .taskDefinition == $task and .desiredCount > 0 and
              .runningCount == .desiredCount and
              (.deployments | length) == 1 and
              .deployments[0].rolloutState == "COMPLETED")
          ' service.json > /dev/null
